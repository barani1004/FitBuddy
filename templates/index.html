<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="brand">
                <span class="brand-icon">💪</span>
                <span>FitBuddy</span>
            </div>

            <h1>Your Personal Fitness Buddy</h1>

            <p class="subtitle">
                Create your personalized 7-day fitness plan.
            </p>

            <form action="/generate" method="post">

                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <label for="age">Age:</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    required
                >

                <label for="weight">Weight:</label>
                <input
                    type="text"
                    id="weight"
                    name="weight"
                    placeholder="e.g. 60 kg"
                    required
                >

                <label for="goal">Goal:</label>
                <select id="goal" name="goal" required>
                    <option value="general wellness">
                        General Wellness
                    </option>
                    <option value="weight management">
                        Weight Management
                    </option>
                    <option value="strength">
                        Strength
                    </option>
                    <option value="fitness">
                        Improve Fitness
                    </option>
                </select>

                <label for="intensity">Preferred Intensity:</label>
                <select id="intensity" name="intensity" required>
                    <option value="low">Low</option>
                    <option value="moderate">Moderate</option>
                    <option value="high">High</option>
                </select>

                <button type="submit">
                    Generate My Workout Plan
                </button>

            </form>

        </div>

        <footer>
            © 2026 FitBuddy | Your Personal Fitness Buddy
        </footer>

    </div>

</body>
</html>
